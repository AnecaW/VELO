name: bike_computer
description: VELO cycling computer with offline recording, maps and personal cloud sync.
publish_to: 'none'
version: 2.5.0+7

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  drift: ^2.12.0
  sqlite3_flutter_libs: ^0.5.11
  path_provider: ^2.0.15
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  geolocator: 14.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  xml: ^7.1.0
  file_picker: ^13.3.0
  flutter_blue_plus: ^1.34.5
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  http: ^1.6.0
  sqlite3: ^3.8.0
  maplibre_gl: ^0.27.1
  app_links: ^7.2.2
  connectivity_plus: ^7.3.2
  workmanager: ^0.10.10
  crypto: ^3.0.8
  supabase_flutter: ^2.18.3
  geolocator_android: 5.2.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.12.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
